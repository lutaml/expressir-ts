name: Publish to npm

# Trusted publishing (npm provenance over GitHub Actions OIDC): the
# workflow claims the id-token; registering the publisher on npmjs
# (the package's Publishing access → Trusted Publisher) is an OWNER
# step and is done once.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The exact version to publish (must match package.json)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked || cargo install wasm-pack
      - name: Refresh the vendored wasm from the submodule pin
        run: npm run refresh-wasm
      - name: Stamp the requested version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: >-
          node -e "const fs=require('fs');const
          p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.RELEASE_VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      # npm trusted publishing needs npm >= 11.5.1 for the OIDC claim.
      - name: Use a TP-capable npm
        run: npm install -g npm@latest
        env:
          GITHUB_EVENT_INPUTS_VERSION: ${{ github.event.inputs.version }}
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      # npm trusted publishing: the OIDC claim matches the publisher
      # registered on @expressir/expressir — no token secret exists.
      - name: Publish with provenance
        run: npm publish --provenance --access public
